name: Quality and security

on:
  push:
    branches: [master]
  pull_request:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * 1'

permissions:
  contents: read

jobs:
  quality:
    name: Standards, metadata and package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: mbstring, zip
          coverage: none
      - id: validate
        run: composer validate --strict
      - id: install
        run: composer install --no-interaction --prefer-dist
      - id: platform
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: composer check-platform-reqs
      - id: audit
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          mkdir -p reports
          composer audit --locked --format=json > reports/composer-audit.json
      - id: lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: composer lint
      - id: standards
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: composer standards
      - id: compatibility
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: composer compatibility
      - id: metadata
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: composer metadata
      - id: reporting_tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python3 -m unittest discover -s tests/reporting -v
      - id: package
        if: ${{ !cancelled() && steps.metadata.outcome == 'success' }}
        run: composer package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: package_upload
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        with:
          name: plugin-package
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14
          overwrite: true
      - name: Record quality and security results
        if: ${{ always() }}
        env:
          CI_STEPS: ${{ toJSON(steps) }}
          CI_JOB_STATUS: ${{ job.status }}
          CI_PACKAGE_URL: ${{ steps.package_upload.outputs.artifact-url }}
        run: python3 .github/scripts/ci-report.py record quality
      - name: Upload quality report
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-data-quality
          path: reports/
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  integration:
    name: WordPress ${{ matrix.wordpress }} / PHP ${{ matrix.php }} / ${{ matrix.mode }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '8.2', wordpress: '6.8', mode: single }
          - { php: '8.2', wordpress: latest, mode: single }
          - { php: '8.3', wordpress: latest, mode: single }
          - { php: '8.4', wordpress: latest, mode: single }
          - { php: '8.5', wordpress: latest, mode: single }
          - { php: '8.4', wordpress: latest, mode: multisite }
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run WordPress integration suite
        uses: ./.github/actions/wordpress-tests
        with:
          wordpress: ${{ matrix.wordpress }}
          php: ${{ matrix.php }}
          mode: ${{ matrix.mode }}

  plugin-check:
    name: WordPress Plugin Check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          extensions: zip
          coverage: none
      - run: php scripts/package.php
      - run: unzip dist/*.zip -d build
      - uses: WordPress/plugin-check-action@10857da14b6c2246d15402b3e69f777edcf8c12e # v1
        id: plugin_check
        with:
          build-dir: build/bulk-password-reset
          slug: bulk-password-reset
      - name: Record Plugin Check result
        if: ${{ always() }}
        env:
          CI_STEPS: ${{ toJSON(steps) }}
          CI_JOB_STATUS: ${{ job.status }}
        run: python3 .github/scripts/ci-report.py record plugin-check
      - name: Upload Plugin Check report
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-data-plugin-check
          path: reports/
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  summary:
    name: CI results overview
    if: ${{ always() }}
    needs: [quality, integration, plugin-check]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: ci-data-*
          path: reports/collected
      - name: Publish test and security overview
        if: ${{ always() }}
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 .github/scripts/ci-report.py summary
      - name: Upload combined report
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-report
          path: reports/
          if-no-files-found: error
          retention-days: 14
          overwrite: true

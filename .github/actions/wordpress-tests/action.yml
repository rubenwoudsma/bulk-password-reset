name: WordPress integration tests
description: Run the security suite on a disposable WordPress site and preserve its evidence.
inputs:
  wordpress:
    description: Exact WordPress version or latest stable
    required: true
  php:
    description: PHP minor version
    required: true
  mode:
    description: single or multisite
    required: true
  profile:
    description: Reporting profile (stable or prerelease)
    default: stable
  artifact-prefix:
    description: Prefix for per-environment report artifacts
    default: ci-data
runs:
  using: composite
  steps:
    - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
      with:
        php-version: ${{ inputs.php }}
        extensions: mysqli, mbstring, zip
        tools: composer:v2
        coverage: none
    - name: Install verified WP-CLI with download retries
      env:
        WP_CLI_VERSION: '2.12.0'
        WP_CLI_SHA256: ce34ddd838f7351d6759068d09793f26755463b4a4610a5a5c0a97b68220d85c
      shell: bash
      run: |
        mkdir -p "$RUNNER_TEMP/bpr-tools"
        curl --fail --location --retry 3 --retry-all-errors --connect-timeout 15 --max-time 120 \
          "https://github.com/wp-cli/wp-cli/releases/download/v${WP_CLI_VERSION}/wp-cli-${WP_CLI_VERSION}.phar" \
          --output "$RUNNER_TEMP/bpr-tools/wp"
        printf '%s  %s\n' "$WP_CLI_SHA256" "$RUNNER_TEMP/bpr-tools/wp" | sha256sum --check
        chmod +x "$RUNNER_TEMP/bpr-tools/wp"
        echo "$RUNNER_TEMP/bpr-tools" >> "$GITHUB_PATH"
    - name: Verify WP-CLI is available
      shell: bash
      run: wp --info
    - id: install
      shell: bash
      run: composer install --no-interaction --prefer-dist
    - id: platform
      shell: bash
      run: composer check-platform-reqs
    - name: Install disposable WordPress
      env:
        WP_VERSION: ${{ inputs.wordpress }}
        WP_MODE: ${{ inputs.mode }}
        BPR_WP_ROOT: ${{ runner.temp }}/wordpress
      shell: bash
      run: |
        mkdir -p reports
        touch reports/wordpress-debug.log
        wp core download --version="$WP_VERSION" --path="$BPR_WP_ROOT"
        wp config create --path="$BPR_WP_ROOT" --dbname=wordpress_test --dbuser=root --dbpass=root --dbhost=127.0.0.1:3306
        wp config set BPR_TESTING true --raw --path="$BPR_WP_ROOT"
        wp config set WP_ENVIRONMENT_TYPE local --path="$BPR_WP_ROOT"
        wp config set WP_DEBUG true --raw --path="$BPR_WP_ROOT"
        wp config set WP_DEBUG_DISPLAY false --raw --path="$BPR_WP_ROOT"
        wp config set WP_DEBUG_LOG "$GITHUB_WORKSPACE/reports/wordpress-debug.log" --path="$BPR_WP_ROOT"
        # Avoid WP-CLI 2.12's success-color helper deprecation on PHP 8.5+.
        # --quiet skips informational output; PHP diagnostics/warnings/errors stay enabled.
        if [ "$WP_MODE" = multisite ]; then
          wp core multisite-install --quiet --path="$BPR_WP_ROOT" --url=http://bpr.test --title=Tests --admin_user=testadmin --admin_password=disposable-test-password --admin_email=admin@example.test --skip-email
        else
          wp core install --quiet --path="$BPR_WP_ROOT" --url=http://bpr.test --title=Tests --admin_user=testadmin --admin_password=disposable-test-password --admin_email=admin@example.test --skip-email
        fi
    - name: Record installed test environment
      shell: bash
      run: |
        mkdir -p reports
        php -r 'echo PHP_VERSION;' > reports/php-version.txt
        wp core version --path="$BPR_WP_ROOT" > reports/wordpress-version.txt
      env:
        BPR_WP_ROOT: ${{ runner.temp }}/wordpress
    - id: tests
      shell: bash
      run: composer test -- --log-junit reports/junit.xml
      env:
        BPR_WP_ROOT: ${{ runner.temp }}/wordpress
        BPR_CI_DEBUG_REPORT: ${{ github.workspace }}/reports/wordpress-debug.json
    - name: Record integration results and check debug log
      if: ${{ always() }}
      env:
        CI_STEPS: ${{ toJSON(steps) }}
        CI_JOB_STATUS: ${{ job.status }}
        CI_PROFILE: ${{ inputs.profile }}
        CI_PHP: ${{ inputs.php }}
        CI_WORDPRESS: ${{ inputs.wordpress }}
        CI_MODE: ${{ inputs.mode }}
      shell: bash
      run: python3 .github/scripts/ci-report.py record integration --profile "$CI_PROFILE"
    - name: Upload integration report
      if: ${{ always() }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.artifact-prefix }}-integration-${{ inputs.wordpress }}-${{ inputs.php }}-${{ inputs.mode }}
        path: reports/
        if-no-files-found: error
        retention-days: 14
        overwrite: true

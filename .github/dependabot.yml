version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - /
      # Composite action dependencies are outside .github/workflows.
      - /.github/actions/wordpress-tests
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # PHPUnit 12+ requires PHP newer than our shared PHP 8.2 test baseline.
    # Keep compatible minor/patch updates; review a major migration separately.
    ignore:
      - dependency-name: phpunit/phpunit
        update-types: ['version-update:semver-major']
    groups:
      development-dependencies:
        dependency-type: development
